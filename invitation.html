.skip-link,
.app-shell,
main,
.mobile-nav {
  position: relative;
  z-index: 1;
}

main {
  display: grid;
  gap: 28px;
  padding: 34px 18px 96px;
}

a {
  color: inherit;
}

.skip-link {
  position: absolute;
  left: 12px;
  top: -48px;
  z-index: 20;
  padding: 10px 14px;
  background: var(--deep-ocean);
  color: white;
  border-radius: 6px;
}

.skip-link:focus {
  top: 12px;
}

.app-shell {
  min-height: 100svh;
  position: relative;
  overflow: hidden;
  padding: max(20px, env(safe-area-inset-top)) 18px 28px;
  display: grid;
  align-content: start;
  gap: 18px;
  background: linear-gradient(180deg, rgba(5, 24, 38, 0.16) 0%, rgba(5, 24, 38, 0.02) 44%, transparent 100%);
}

.app-shell::before,
.app-shell::after {
  content: "";
  position: absolute;
  z-index: 0;
  pointer-events: none;
}

.app-shell::before {
  inset: 0;
  height: auto;
  background:
    radial-gradient(ellipse at 50% 40%, rgba(255, 250, 241, 0.06) 0 20%, transparent 58%),
    linear-gradient(180deg, rgba(6, 39, 59, 0.08), transparent 30%, rgba(255, 250, 241, 0.04));
}

.app-shell::after {
  inset: 0;
  background: linear-gradient(90deg, rgba(6, 39, 59, 0.06), transparent 18%, transparent 82%, rgba(6, 39, 59, 0.06));
}

.hawaii-art,
.hawaii-art span {
  position: absolute;
  pointer-events: none;
}

.hawaii-art {
  inset: 0;
  z-index: 0;
  overflow: hidden;
}

  filter: blur(0.2px);
  opacity: 0.78;
}

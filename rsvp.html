<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#123d58" />
    <title>RSVP | Garrison & Nhuna</title>
    <style>
      :root {
        --ocean: #103d5b;
        --deep-ocean: #06273b;
        --reef: #087f8b;
        --paper: #fffaf1;
        --hibiscus: #e97868;
        --ink: #132834;
        --muted: #607481;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      html { background: var(--deep-ocean); }
      body {
        min-height: 100svh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 82% 8%, rgba(233, 120, 104, 0.38), transparent 22%),
          radial-gradient(circle at 18% 18%, rgba(158, 221, 218, 0.35), transparent 24%),
          linear-gradient(180deg, rgba(6, 39, 59, 0.96), rgba(8, 127, 139, 0.72) 48%, rgba(255, 250, 241, 0.74));
      }
      .page-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 44px;
        padding: max(20px, env(safe-area-inset-top)) 18px 0;
        color: white;
      }
      .brand, .locale {
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 999px;
        background: rgba(9, 37, 54, 0.28);
        backdrop-filter: blur(12px);
      }
      .brand {
        min-width: 68px;
        height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 12px;
        color: inherit;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.1rem;
        font-weight: 700;
        text-decoration: none;
      }
      .locale { padding: 10px 13px; font-size: 0.8rem; font-weight: 850; }
      main { display: grid; min-height: calc(100svh - 72px); align-content: start; gap: 28px; padding: 64px 18px 96px; }
      .section {
        width: 100%;
        margin: 0;
        padding: 22px 18px;
        border: 1px solid rgba(255, 255, 255, 0.54);
        border-radius: 10px;
        background: rgba(255, 250, 241, 0.28);
        box-shadow: 0 18px 44px rgba(9, 37, 54, 0.18);
        backdrop-filter: blur(10px) saturate(1.16);
      }
      .section-kicker { margin: 0 0 10px; color: var(--hibiscus); font-size: 0.76rem; font-weight: 950; letter-spacing: 0.14em; text-transform: uppercase; }
      h1 {
        margin: 0 0 18px;
        color: var(--ocean);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.65rem, 13vw, 4.6rem);
        font-weight: 500;
        line-height: 0.98;
      }
      .section-copy { margin: 0 0 20px; color: var(--muted); line-height: 1.55; }
      .form-frame-wrap {
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.48);
        border-radius: 10px;
        background: rgba(255, 250, 241, 0.78);
        box-shadow: 0 14px 34px rgba(9, 37, 54, 0.16);
      }
      .form-frame {
        width: 100%;
        height: min(76svh, 760px);
        display: block;
        border: 0;
      }
      .button {
        min-height: 50px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 13px 16px;
        border: 0;
        border-radius: 8px;
        color: white;
        background: var(--ocean);
        font: inherit;
        font-weight: 900;
        cursor: pointer;
        text-decoration: none;
      }
      .form-actions { display: grid; gap: 10px; margin-top: 16px; }
      .form-note { margin: 0; color: var(--muted); font-size: 0.9rem; line-height: 1.4; text-align: center; }
      .mobile-nav {
        position: sticky;
        bottom: 0;
        z-index: 10;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        padding: 8px 8px max(8px, env(safe-area-inset-bottom));
        border-top: 1px solid rgba(19, 40, 52, 0.12);
        background: rgba(255, 250, 241, 0.72);
        backdrop-filter: blur(18px);
      }
      .mobile-nav a {
        min-height: 44px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        color: var(--muted);
        text-decoration: none;
        font-size: 0.76rem;
        font-weight: 950;
      }
      .mobile-nav a.is-active, .mobile-nav a:focus, .mobile-nav a:hover { color: white; background: var(--reef); }
      @media (min-width: 720px) {
        .page-topbar { padding-left: max(40px, calc((100vw - 760px) / 2)); padding-right: max(40px, calc((100vw - 760px) / 2)); }
        main { padding-left: 40px; padding-right: 40px; }
        .section { width: min(760px, calc(100% - 80px)); margin-left: auto; margin-right: auto; }
        .mobile-nav { width: min(480px, calc(100% - 24px)); margin: 0 auto 12px; border: 1px solid rgba(19, 40, 52, 0.12); border-radius: 14px; }
      }
    </style>
  </head>
  <body>
    <header class="page-topbar">
      <a class="brand" href="index.html">G &amp; N</a>
      <span class="locale">Waikiki, Hawaii</span>
    </header>

    <main>
      <section class="section">
        <p class="section-kicker">RSVP</p>
        <h1>Reply</h1>
        <p class="section-copy">Please share your response for the wedding of Garrison and Nhuna.</p>
        <div class="form-frame-wrap">
          <iframe
            class="form-frame"
            title="Garrison and Nhuna wedding RSVP form"
            src="https://docs.google.com/forms/d/e/1FAIpQLSdbG9m1RpPZTpO4eK_nkEfrW2g6xnRjEUPNATmhWgpolRXWPw/viewform?embedded=true"
            loading="lazy"
          >Loading RSVP form...</iframe>
        </div>
        <div class="form-actions">
          <a class="button" href="https://docs.google.com/forms/d/e/1FAIpQLSdbG9m1RpPZTpO4eK_nkEfrW2g6xnRjEUPNATmhWgpolRXWPw/viewform?usp=publish-editor" rel="noreferrer">Open RSVP form</a>
          <p class="form-note">If the embedded form does not load, open it directly.</p>
        </div>
      </section>
    </main>

    <nav class="mobile-nav" aria-label="Quick navigation">
      <a href="index.html">Home</a>
      <a class="is-active" href="invitation.html">Invite</a>
      <a href="details.html">Details</a>
    </nav>
  </body>
</html>

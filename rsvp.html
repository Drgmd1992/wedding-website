<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#123d58" />
    <title>RSVP | Garrison & Nhuna</title>
    <style>
      :root {
        --ocean: #103d5b;
        --deep-ocean: #06273b;
        --reef: #087f8b;
        --paper: #fffaf1;
        --hibiscus: #e97868;
        --ink: #132834;
        --muted: #607481;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      html { background: var(--deep-ocean); }
      body {
        min-height: 100svh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 82% 8%, rgba(233, 120, 104, 0.38), transparent 22%),
          radial-gradient(circle at 18% 18%, rgba(158, 221, 218, 0.35), transparent 24%),
          linear-gradient(180deg, rgba(6, 39, 59, 0.96), rgba(8, 127, 139, 0.72) 48%, rgba(255, 250, 241, 0.74));
      }
      .page-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 44px;
        padding: max(20px, env(safe-area-inset-top)) 18px 0;
        color: white;
      }
      .brand, .locale {
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 999px;
        background: rgba(9, 37, 54, 0.28);
        backdrop-filter: blur(12px);
      }
      .brand {
        min-width: 68px;
        height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 12px;
        color: inherit;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.1rem;
        font-weight: 700;
        text-decoration: none;
      }
      .locale { padding: 10px 13px; font-size: 0.8rem; font-weight: 850; }
      main { display: grid; min-height: calc(100svh - 72px); align-content: start; gap: 28px; padding: 64px 18px 96px; }
      .section {
        width: 100%;
        margin: 0;
        padding: 22px 18px;
        border: 1px solid rgba(255, 255, 255, 0.54);
        border-radius: 10px;
        background: rgba(255, 250, 241, 0.28);
        box-shadow: 0 18px 44px rgba(9, 37, 54, 0.18);
        backdrop-filter: blur(10px) saturate(1.16);
      }
      .section-kicker { margin: 0 0 10px; color: var(--hibiscus); font-size: 0.76rem; font-weight: 950; letter-spacing: 0.14em; text-transform: uppercase; }
      h1 {
        margin: 0 0 18px;
        color: var(--ocean);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.65rem, 13vw, 4.6rem);
        font-weight: 500;
        line-height: 0.98;
      }
      .section-copy { margin: 0 0 20px; color: var(--muted); line-height: 1.55; }
      .rsvp-form { display: grid; gap: 14px; }
      .rsvp-form label, .rsvp-form fieldset { display: grid; gap: 8px; margin: 0; }
      .rsvp-form fieldset {
        padding: 14px;
        border: 1px solid rgba(255, 255, 255, 0.46);
        border-radius: 8px;
        background: rgba(255, 250, 241, 0.22);
      }
      .rsvp-form legend, .rsvp-form label > span { color: var(--ocean); font-size: 0.82rem; font-weight: 900; }
      .rsvp-form input, .rsvp-form textarea {
        width: 100%;
        border: 1px solid rgba(19, 40, 52, 0.2);
        border-radius: 8px;
        padding: 13px 12px;
        color: var(--ink);
        background: rgba(255, 250, 241, 0.82);
        font: inherit;
        outline: none;
      }
      .rsvp-form input:focus, .rsvp-form textarea:focus { border-color: var(--reef); box-shadow: 0 0 0 3px rgba(8, 127, 139, 0.18); }
      .choice-row { grid-template-columns: 22px 1fr; align-items: center; color: var(--ink); font-weight: 750; }
      .choice-row input { width: 18px; height: 18px; padding: 0; accent-color: var(--reef); }
      .button {
        min-height: 50px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 13px 16px;
        border: 0;
        border-radius: 8px;
        color: white;
        background: var(--ocean);
        font: inherit;
        font-weight: 900;
        cursor: pointer;
      }
      .form-note { margin: 0; color: var(--muted); font-size: 0.9rem; line-height: 1.4; }
      .mobile-nav {
        position: sticky;
        bottom: 0;
        z-index: 10;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        padding: 8px 8px max(8px, env(safe-area-inset-bottom));
        border-top: 1px solid rgba(19, 40, 52, 0.12);
        background: rgba(255, 250, 241, 0.72);
        backdrop-filter: blur(18px);
      }
      .mobile-nav a {
        min-height: 44px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        color: var(--muted);
        text-decoration: none;
        font-size: 0.76rem;
        font-weight: 950;
      }
      .mobile-nav a.is-active, .mobile-nav a:focus, .mobile-nav a:hover { color: white; background: var(--reef); }
      @media (min-width: 720px) {
        .page-topbar { padding-left: max(40px, calc((100vw - 760px) / 2)); padding-right: max(40px, calc((100vw - 760px) / 2)); }
        main { padding-left: 40px; padding-right: 40px; }
        .section { width: min(760px, calc(100% - 80px)); margin-left: auto; margin-right: auto; }
        .mobile-nav { width: min(480px, calc(100% - 24px)); margin: 0 auto 12px; border: 1px solid rgba(19, 40, 52, 0.12); border-radius: 14px; }
      }
    </style>
  </head>
  <body>
    <header class="page-topbar">
      <a class="brand" href="index.html">G &amp; N</a>
      <span class="locale">Waikiki, Hawaii</span>
    </header>

    <main>
      <section class="section">
        <p class="section-kicker">RSVP</p>
        <h1>Reply</h1>
        <p class="section-copy">Please share your response for the wedding of Garrison and Nhuna.</p>
        <form class="rsvp-form" id="rsvpForm">
          <label>
            <span>Your name</span>
            <input name="guestName" type="text" autocomplete="name" required />
          </label>
          <fieldset>
            <legend>Will you attend?</legend>
            <label class="choice-row"><input name="attendance" type="radio" value="Joyfully accepts" required /><span>Joyfully accepts</span></label>
            <label class="choice-row"><input name="attendance" type="radio" value="Regretfully declines" /><span>Regretfully declines</span></label>
          </fieldset>
          <label>
            <span>Number of guests</span>
            <input name="guestCount" type="number" min="1" max="10" inputmode="numeric" required />
          </label>
          <label>
            <span>Guest names</span>
            <textarea name="guestNames" rows="4" placeholder="List each guest attending"></textarea>
          </label>
          <label>
            <span>Dietary restrictions or allergies</span>
            <textarea name="dietaryNotes" rows="4" placeholder="Optional"></textarea>
          </label>
          <label>
            <span>Email or phone number</span>
            <input name="contact" type="text" autocomplete="email" required />
          </label>
          <button class="button" type="submit">Submit RSVP</button>
          <p class="form-note" id="rsvpNote" role="status"></p>
        </form>
      </section>
    </main>

    <nav class="mobile-nav" aria-label="Quick navigation">
      <a href="index.html">Home</a>
      <a class="is-active" href="invitation.html">Invite</a>
      <a href="details.html">Details</a>
    </nav>
    <script>
      const rsvpForm = document.querySelector("#rsvpForm");
      const rsvpNote = document.querySelector("#rsvpNote");
      rsvpForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const data = new FormData(rsvpForm);
        const lines = [
          "Wedding RSVP",
          "",
          `Name: ${data.get("guestName") || ""}`,
          `Attendance: ${data.get("attendance") || ""}`,
          `Number of guests: ${data.get("guestCount") || ""}`,
          `Guest names: ${data.get("guestNames") || ""}`,
          `Dietary restrictions or allergies: ${data.get("dietaryNotes") || ""}`,
          `Contact: ${data.get("contact") || ""}`
        ];
        rsvpNote.textContent = "Opening your email app to send the RSVP. We can connect this to Google Forms next.";
        window.location.href = `mailto:?subject=${encodeURIComponent("Wedding RSVP")}&body=${encodeURIComponent(lines.join("\n"))}`;
      });
    </script>
  </body>
</html>
